<!-- HERO BACKGROUND -->

<!-- FORM -->
<section class="py-20 relative z-10">
  <div class="max-w-xl mx-auto px-6">

    <div class="bg-white/70 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-white/30 animate-fadeIn">

      <h2 class="text-3xl font-extrabold text-center mb-2 text-primary">
        Student Registration
      </h2>

      <p class="text-center text-gray-500 mb-8 text-sm">
        Complete payment to secure your seat
      </p>

      <form id="registerForm" class="space-y-4">

        <input id="name" type="text" placeholder="Full Name" class="input" required />
        <input id="fatherName" type="text" placeholder="Father's Full Name" class="input" required />
        <input id="motherName" type="text" placeholder="Mother's Full Name" class="input" required />
        <input id="email" type="email" placeholder="Email Address" class="input" required />
        <input id="password" type="password" placeholder="Create Password" class="input" required />
        <input id="mobile" type="tel" placeholder="Mobile Number" class="input" required />

        <div class="section-label">Choose Your Learning Format</div>

        <div class="format-grid">
          <label class="format-option">
            <input type="radio" name="learningFormat" value="offline" required />
            <span class="format-card">
              <span class="format-icon">🏫</span>
              <span class="format-content">
                <strong>Offline Coaching</strong>
                <small>Classroom learning in Begusarai</small>
              </span>
              <span class="format-check">✓</span>
            </span>
          </label>

          <label class="format-option">
            <input type="radio" name="learningFormat" value="online" required />
            <span class="format-card">
              <span class="format-icon">💻</span>
              <span class="format-content">
                <strong>Online Personal Tuition</strong>
                <small>Dedicated online sessions from Mentora Edge</small>
              </span>
              <span class="format-check">✓</span>
            </span>
          </label>
        </div>

        <input id="classField" readonly class="input bg-gray-100"/>
        <input id="subjectField" readonly class="input bg-gray-100"/>
        <input id="feeField" readonly class="input bg-gray-100"/>

        <!-- PAYMENT -->
        <div class="mt-6 p-6 rounded-2xl bg-white/60 backdrop-blur-md border border-white/30 shadow-lg text-center">

          <p class="font-semibold mb-3 text-primary">Scan & Pay</p>

          <img id="qrImage" class="mx-auto mb-4 w-40 h-40 rounded-xl shadow-lg hover:scale-105 transition"/>

          <p class="text-sm mb-2">
            Pay <span class="font-bold text-accent">₹<span id="feeAmount"></span></span>
          </p>

          <p class="text-xs text-gray-600">
            UPI ID: <strong>abirmunshi200@okhdfcbank</strong>
          </p>

          <p id="timer" class="text-red-500 font-semibold mt-3">
            Time left: 03:00
          </p>
        </div>

        <!-- TERMS -->
        <div class="flex items-start gap-2 mt-4">
          <input type="checkbox" id="agreeTerms" class="mt-1 accent-green-600" required />
          <label class="text-sm">
            I agree to the
            <a href="/terms.html" target="_blank" class="text-accent font-medium hover:underline">
              Terms & Conditions
            </a>
          </label>
        </div>

        <!-- BUTTON -->
        <button
          type="button"
          id="payBtn"
          disabled
          class="w-full py-3 rounded-xl font-semibold
                 bg-gradient-to-r from-green-500 to-green-600 text-white
                 opacity-50 cursor-not-allowed
                 transition-all duration-300 hover:scale-105">
          Payment Completed
        </button>

        <button
          type="button"
          onclick="location.href='programs.html'"
          class="w-full border py-3 rounded-xl hover:bg-gray-50 transition">
          Cancel Payment
        </button>

      </form>

      <div id="successMsg"
           class="hidden mt-8 text-center text-green-600 font-semibold animate-scaleIn">
        ✅ Registration Successful! Await admin approval.
      </div>

    </div>
  </div>
</section>

<!-- FIREBASE LOGIC (UNCHANGED) -->
<script type="module">
import { auth, db } from "./js/firebase.js";
import { createUserWithEmailAndPassword } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const params = new URLSearchParams(window.location.search);
const cls = params.get("class");
const rawSubject = params.get("subject");
const subject = rawSubject ? rawSubject.replace(/\+/g, " ") : "";
const fee = params.get("fee");

classField.value = cls;
subjectField.value = subject;
feeField.value = `₹${fee}`;
feeAmount.innerText = fee;

const inputs = document.querySelectorAll("#registerForm input");

function getLearningFormat() {
  return document.querySelector('input[name="learningFormat"]:checked')?.value || "";
}

function validateForm() {
  const valid = [...inputs].every(input =>
    input.type === "checkbox" ? input.checked :
    input.type === "radio" ? true :
    input.value.trim()
  );

  const formValid = valid && !!getLearningFormat();

  payBtn.disabled = !formValid;
  payBtn.classList.toggle("opacity-50", !formValid);
  payBtn.classList.toggle("cursor-not-allowed", !formValid);
}

inputs.forEach(i => i.addEventListener("input", validateForm));

const upi = `upi://pay?pa=abirmunshi200@okhdfcbank&pn=Mentora Edge&am=${fee}&cu=INR`;
qrImage.src =
  `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(upi)}`;

let seconds = 180;
const interval = setInterval(() => {
  seconds--;
  const m = String(Math.floor(seconds / 60)).padStart(2, "0");
  const s = String(seconds % 60).padStart(2, "0");
  timer.innerText = `Time left: ${m}:${s}`;
  if (seconds <= 0) {
    clearInterval(interval);
    alert("Payment session expired");
    location.href = "index.html";
  }
}, 1000);
const nameInput = document.getElementById("name");
const fatherInput = document.getElementById("fatherName");
const motherInput = document.getElementById("motherName");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const mobileInput = document.getElementById("mobile");
const formatInputs = document.querySelectorAll('input[name="learningFormat"]');

formatInputs.forEach(input => input.addEventListener("change", () => {
  validateForm();
  const selected = getLearningFormat();
  const summary = document.getElementById("formatSummary");
  const text = document.getElementById("formatSummaryText");
  const icon = document.querySelector(".format-summary-icon");

  if (selected === "offline") {
    text.textContent = "Offline Coaching • Begusarai";
    icon.textContent = "🏫";
    summary.classList.add("active");
  } else if (selected === "online") {
    text.textContent = "Online Personal Tuition";
    icon.textContent = "💻";
    summary.classList.add("active");
  }
}));

validateForm();

payBtn.onclick = async () => {
  try {
    payBtn.innerText = "Processing…";
    clearInterval(interval);

    const cred = await createUserWithEmailAndPassword(
      auth,
      emailInput.value,
      passwordInput.value
    );

    await setDoc(doc(db, "users", cred.user.uid), {
      name: nameInput.value,
      fatherName: fatherInput.value,
      motherName: motherInput.value,
      email: emailInput.value,
      mobile: mobileInput.value,
      learningFormat: getLearningFormat(),
      class: cls,
      subject,
      role: "student",
      status: "pending",
      createdAt: serverTimestamp()
    });


    registerForm.classList.add("hidden");
    successMsg.classList.remove("hidden");
    setTimeout(() => location.href = "index.html", 2500);

  } catch (err) {
    alert(err.message);
    payBtn.innerText = "Payment Completed";
  }
};
</script>

  display:inline-flex;
  align-items:center;
  gap:8px;
  margin-top:13px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.12);
  color:#dc2626;
  font-weight:800;
  font-size:.78rem;
}
.timer-dot{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:timerPulse 1s ease-in-out infinite}
@keyframes timerPulse{50%{transform:scale(1.45);opacity:.55}}
.terms{
  display:flex;align-items:flex-start;gap:10px;
  margin-top:18px;padding:13px 14px;
  border-radius:16px;
  background:rgba(255,255,255,.38);
  border:1px solid rgba(15,42,68,.06);
}
.terms input{margin-top:3px;width:16px;height:16px;accent-color:var(--green)}
.terms label{font-size:.78rem;line-height:1.55;color:#64748b}
.terms a{color:#16a34a;font-weight:800;text-decoration:none}
.terms a:hover{text-decoration:underline}
.actions{display:grid;gap:11px;margin-top:18px}
.primary-btn,.secondary-btn{
  position:relative;
  overflow:hidden;
  width:100%;
  min-height:53px;
  border-radius:16px;
  font-weight:800;
  transition:transform .35s ease,box-shadow .35s ease,opacity .35s ease,background .35s ease;
}
.primary-btn{
  color:white;
  background:linear-gradient(135deg,#16a34a,#22c55e,#4ade80);
  box-shadow:0 14px 30px rgba(34,197,94,.22);
}
.primary-btn::before,.secondary-btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 48%,transparent 66%);
  transform:translateX(-130%);
  transition:transform .7s ease;
}
.primary-btn:not(:disabled):hover,.secondary-btn:hover{transform:translateY(-3px)}
.primary-btn:not(:disabled):hover{box-shadow:0 20px 42px rgba(34,197,94,.30)}
.primary-btn:not(:disabled):hover::before,.secondary-btn:hover::before{transform:translateX(130%)}
.primary-btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none}
.secondary-btn{
  background:rgba(255,255,255,.46);
  border:1px solid rgba(15,42,68,.11);
  color:var(--navy);
}
.secondary-btn:hover{background:rgba(255,255,255,.78);border-color:rgba(34,197,94,.25)}
.success{
  padding:30px 20px;
  text-align:center;
}
.success-icon{
  width:70px;height:70px;margin:0 auto 16px;
  display:grid;place-items:center;
  border-radius:22px;
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.20);
  font-size:2rem;
  animation:successPop .65s cubic-bezier(.2,1.5,.4,1) both,successFloat 3s ease-in-out 1s infinite;
}
@keyframes successPop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes successFloat{50%{transform:translateY(-6px)}}
.success h3{font-size:1.55rem;font-weight:800;color:var(--navy)}
.success p{margin-top:7px;color:#64748b;font-size:.88rem}
.reveal{opacity:0;transform:translateY(26px) scale(.985);filter:blur(5px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .8s ease}
.reveal.active{opacity:1;transform:none;filter:none}
.reveal-left{opacity:0;transform:translateX(-35px);filter:blur(4px);transition:all .85s cubic-bezier(.2,.8,.2,1)}
.reveal-left.active{opacity:1;transform:none;filter:none}
.reveal-right{opacity:0;transform:translateX(35px);filter:blur(4px);transition:all .85s cubic-bezier(.2,.8,.2,1)}
.reveal-right.active{opacity:1;transform:none;filter:none}
.float-card{animation:cardFloat 5s ease-in-out infinite}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tilt{transform-style:preserve-3d;will-change:transform}
@media (max-width:900px){
  .registration-layout{grid-template-columns:1fr;max-width:700px}
  .intro-card{position:relative;top:auto}
}
@media (max-width:640px){
  .hero-wrap{padding:48px 14px 65px}
  .intro-card,.form-card{padding:22px;border-radius:25px}
  .hero-title{font-size:2.55rem}
  .field-grid{grid-template-columns:1fr}
  .field-wrap.full,.section-label{grid-column:auto}
  .format-grid{grid-template-columns:1fr}
  .format-card{min-height:88px}
  .payment-card{padding:19px}
  .qr-shell{width:170px;height:170px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
  .reveal,.reveal-left,.reveal-right{opacity:1;transform:none;filter:none}
}
</style>

<div class="page-orb orb-one"></div>
<div class="page-orb orb-two"></div>
<div class="page-orb orb-three"></div>

<script>
const nav = document.querySelector('.site-nav');
window.addEventListener('scroll',()=>nav && nav.classList.toggle('scrolled',window.scrollY>12),{passive:true});

const revealObserver = new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('active');
      revealObserver.unobserve(entry.target);
    }
  });
},{threshold:.12});
document.querySelectorAll('.reveal,.reveal-left,.reveal-right').forEach(el=>revealObserver.observe(el));

document.querySelectorAll('.tilt').forEach(card=>{
  card.addEventListener('pointermove',e=>{
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r=card.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5;
    const y=(e.clientY-r.top)/r.height-.5;
    card.style.transform=`perspective(900px) rotateX(${(-y*3).toFixed(2)}deg) rotateY(${(x*3).toFixed(2)}deg) translateY(-4px)`;
  });
  card.addEventListener('pointerleave',()=>card.style.transform='');
});

window.addEventListener('scroll',()=>{
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const y=window.scrollY;
  document.querySelector('.orb-one')?.style.setProperty('transform',`translate3d(${y*.025}px,${y*.045}px,0)`);
  document.querySelector('.orb-two')?.style.setProperty('transform',`translate3d(${-y*.018}px,${-y*.035}px,0)`);
},{passive:true});
</script>
