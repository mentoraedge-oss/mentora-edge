<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1E40AF">
<link rel="apple-touch-icon" href="/icons/ios/180.png">
  <title>Student Signup | Mentora Edge</title>

  <link rel="icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="bg-gray-100 font-[Inter]">

  <div class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white p-6 md:p-8 rounded shadow w-full max-w-md">

      <h2 class="text-2xl font-bold text-center text-primary mb-2">
        Create Student Account
      </h2>

      <p class="text-sm text-gray-500 text-center mb-6">
        Mentora Edge | Classes IX-XII</p>

      <form id="signupForm" class="space-y-4">

        <input type="text" id="name" placeholder="Full Name" required
          class="w-full border px-4 py-3 rounded">

        <input type="email" id="email" placeholder="Email Address" required
          class="w-full border px-4 py-3 rounded">

        <input type="password" id="password" placeholder="Password (min 6 characters)" minlength="6" required
          class="w-full border px-4 py-3 rounded">

        <select id="class" required
          class="w-full border px-4 py-3 rounded bg-white">
          <option value="">Select Class</option>
        </select>

        <select id="subject" required
          class="w-full border px-4 py-3 rounded bg-white">
          <option value="">Select Subject</option>
        </select>

        <select id="paymentFrequency" required
          class="w-full border px-4 py-3 rounded bg-white">
          <option value="">Select Payment Frequency</option>
        </select>

        <p id="feeSummary" class="rounded-lg bg-green-50 p-3 text-sm text-gray-700" aria-live="polite">
          Select a valid class, subject or program, and payment frequency.
        </p>

        <button type="submit"
          class="w-full bg-primary text-white py-3 rounded hover:bg-blue-700">
          Create Account
        </button>

        <p class="text-sm text-center text-gray-600">
          Already have an account?
          <a href="login.html" class="text-primary font-medium">Login</a>
        </p>

      </form>

      <p id="error" class="text-red-600 text-sm mt-4 hidden"></p>

    </div>
  </div>

  <!-- SIGNUP SCRIPT -->
  <script type="module">
    import { auth, db } from "./js/firebase.js";
    import { createUserWithEmailAndPassword } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      ACADEMIC_PROGRAMS,
      ACTIVE_CLASSES,
      ALL_SUBJECTS_VALUE,
      formatINR,
      getAcademicTier,
      getOfferingOptions,
      getPaymentFrequencies,
      getPlanDetails
    } from "./js/academic-programs.js";

    const form = document.getElementById("signupForm");
    const errorMsg = document.getElementById("error");
    const classSelect = document.getElementById("class");
    const subjectSelect = document.getElementById("subject");
    const frequencySelect = document.getElementById("paymentFrequency");
    const feeSummary = document.getElementById("feeSummary");

    function fillSelect(select, items, placeholder) {
      select.innerHTML = "";
      const prompt = document.createElement("option");
      prompt.value = "";
      prompt.textContent = placeholder;
      select.appendChild(prompt);
      items.forEach(item => {
        const option = document.createElement("option");
        option.value = typeof item === "string" ? item : item.value;
        option.textContent = typeof item === "string" ? item : item.label;
        select.appendChild(option);
      });
    }

    fillSelect(classSelect, ACTIVE_CLASSES.map(value => ({ value, label: "Class " + value })), "Select Class");

    function updateSummary() {
      const plan = getPlanDetails(classSelect.value, subjectSelect.value, frequencySelect.value);
      if (!plan) {
        feeSummary.textContent = "Select a valid class, subject or program, and payment frequency.";
        return null;
      }
      const combo = subjectSelect.value === ALL_SUBJECTS_VALUE;
      if (combo && frequencySelect.value === "quarterly") {
        feeSummary.textContent = "Quarterly: " + plan.installments.map(formatINR).join(" + ") +
          ". Total " + formatINR(plan.total) + "; first installment due now " + formatINR(plan.amountDue) + ".";
      } else if (combo && frequencySelect.value === "annual") {
        feeSummary.textContent = "Annual value " + formatINR(plan.originalAmount) +
          "; discount " + formatINR(plan.discount) + "; final price " + formatINR(plan.total) + ".";
      } else if (combo) {
        feeSummary.textContent = "All-subject combo: " + formatINR(plan.total) + " per month.";
      } else if (getAcademicTier(classSelect.value) === "senior") {
        feeSummary.textContent = "English, annual only: " + formatINR(plan.total) + " per year.";
      } else {
        feeSummary.textContent = subjectSelect.value + ": " + formatINR(plan.total) + " per month.";
      }
      return plan;
    }

    function refreshFrequencies() {
      const frequencies = getPaymentFrequencies(classSelect.value, subjectSelect.value);
      const labels = { monthly: "Monthly", quarterly: "Quarterly", annual: "Annual" };
      fillSelect(frequencySelect, frequencies.map(value => ({ value, label: labels[value] })), "Select Payment Frequency");
      if (frequencies.length) frequencySelect.value = frequencies[0];
      updateSummary();
    }

    classSelect.addEventListener("change", () => {
      fillSelect(subjectSelect, getOfferingOptions(classSelect.value), "Select Subject or Program");
      refreshFrequencies();
    });
    subjectSelect.addEventListener("change", refreshFrequencies);
    frequencySelect.addEventListener("change", updateSummary);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      const plan = updateSummary();
      if (!form.checkValidity() || !plan) {
        form.reportValidity();
        errorMsg.textContent = "Choose a valid class, subject or program, and payment frequency.";
        errorMsg.classList.remove("hidden");
        return;
      }

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const studentClass = classSelect.value;
      const offering = subjectSelect.value;
      const isCombo = offering === ALL_SUBJECTS_VALUE;
      const subject = isCombo
        ? ACADEMIC_PROGRAMS.secondary.combo.subjects.join(", ")
        : offering;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const profile = {
          name,
          email,
          class: studentClass,
          subject,
          programType: isCombo ? ALL_SUBJECTS_VALUE : "individual-subject",
          paymentFrequency: frequencySelect.value,
          feeAmount: plan.amountDue,
          planTotal: plan.total,
          paymentDueAtRegistration: plan.amountDue,
          role: "student",
          status: "pending",
          createdAt: serverTimestamp()
        };
        if (plan.originalAmount !== undefined) {
          profile.annualValue = plan.originalAmount;
          profile.discount = plan.discount;
        }
        if (plan.installments) profile.paymentInstallments = plan.installments;
        await setDoc(doc(db, "users", userCredential.user.uid), profile);

        alert("Account created successfully! Please login.");
        window.location.href = "login.html";
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
      }
    });
  </script>


</body>
</html>
